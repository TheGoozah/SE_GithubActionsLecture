name: '[Demo_6] Build with Cache'
run-name: Build with ccache + actions/cache

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  BUILD_TYPE: Debug
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Restore / save ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ env.BUILD_TYPE }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.BUILD_TYPE }}-

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Project
        run: cmake --build build

      - name: ccache statistics
        run: ccache --show-stats

      - name: Run Tests
        run: ctest --test-dir build
