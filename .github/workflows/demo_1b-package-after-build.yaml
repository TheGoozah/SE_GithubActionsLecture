name: '[Demo_1b] Package'
run-name: Package after Build & Test

on:
  workflow_run:
    workflows: ['\[Demo_1\] Build & Test']   # must match the "name:" of demo_1, not its run-name
    types: [completed]                     # start when it has finished

jobs:
  package:
    # completed = passed OR failed, so check the result
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Package
        run: echo "Build & Test passed, packaging..."
