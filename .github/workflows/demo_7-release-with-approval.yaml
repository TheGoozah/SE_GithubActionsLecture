name: '[Demo_7] Release'
run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.2) - the tag will be v<version>'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: v${{ inputs.version }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Validate version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not in the form MAJOR.MINOR.PATCH (e.g. 1.0.2)"
            exit 1
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Configure CMake
        run: cmake -S . -B build

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: ci-demo-windows
          path: build/Release/CI_Demo.exe
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.TAG }}
    permissions:
      contents: write
    steps:
      - name: Download executable
        uses: actions/download-artifact@v8
        with:
          name: ci-demo-windows

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" CI_Demo.exe \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "CI Demo $TAG" \
            --generate-notes
